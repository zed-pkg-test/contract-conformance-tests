name: certify common desktop platform v2

on:
  pull_request:
    paths:
      - "evidence/common-desktop-platform-v2/**"
      - ".github/workflows/certify-common-desktop-platform-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-rust-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out carrier evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust 1.82.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy

      - name: Verify exact source snapshot identities
        shell: bash
        run: |
          set -euo pipefail
          root='evidence/common-desktop-platform-v2'
          jq -e '.source.commit_sha == "84f7e3008edf532357aebe82cf7a3c35f62c197e"' "$root/source-lock.json" >/dev/null
          jq -r '.files | to_entries[] | [.key,.value] | @tsv' "$root/source-lock.json" |
          while IFS=$'\t' read -r path expected; do
            actual="$(git hash-object "$root/$path")"
            test "$actual" = "$expected" || {
              echo "source snapshot mismatch: $path expected=$expected actual=$actual" >&2
              exit 1
            }
          done

      - name: Generate exact workspace lock from source manifests
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/evidence/common-desktop-platform-v2/lock-workspace"
          rm -f "$root/Cargo.lock"
          cargo generate-lockfile --manifest-path "$root/Cargo.toml"
          cargo metadata --manifest-path "$root/Cargo.toml" --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
          jq -e '.packages | any(.name == "ores-runtime-generation" and .version == "0.1.0")' "$RUNNER_TEMP/metadata.json" >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/evidence/common-desktop-platform-v2/generated"
          cp "$root/Cargo.lock" "$GITHUB_WORKSPACE/evidence/common-desktop-platform-v2/generated/Cargo.lock"

      - name: Format digest-bound recovery delta
        run: cargo fmt --manifest-path evidence/common-desktop-platform-v2/delta-workspace/Cargo.toml --all -- --check

      - name: Clippy digest-bound recovery delta
        run: cargo clippy --manifest-path evidence/common-desktop-platform-v2/delta-workspace/Cargo.toml --all-targets -- -D warnings

      - name: Test digest-bound recovery delta
        run: cargo test --manifest-path evidence/common-desktop-platform-v2/delta-workspace/Cargo.toml --all-targets

      - name: Upload Cargo-generated source lock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: common-desktop-platform-v2-cargo-lock
          path: evidence/common-desktop-platform-v2/generated/Cargo.lock
          if-no-files-found: error
          retention-days: 7
