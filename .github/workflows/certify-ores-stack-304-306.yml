name: certify ores-stack 304-306 lambda contract parity

on:
  pull_request:
    paths:
      - "evidence/ores-stack-304-306/**"
      - ".github/workflows/certify-ores-stack-304-306.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pr: [304, 305, 306]
    steps:
      - name: Check out carrier evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up source CI Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Verify exact source blob identities
        shell: bash
        env:
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          root='evidence/ores-stack-304-306'
          jq -e --arg pr "$PR_NUMBER" '.pull_requests[$pr].commit_sha | test("^[0-9a-f]{40}$")' "$root/source-lock.json" >/dev/null

          expected_pkg="$(jq -r --arg pr "$PR_NUMBER" '.pull_requests[$pr].files["package.json"]' "$root/source-lock.json")"
          test "$(git hash-object "$root/pr-$PR_NUMBER/package.json")" = "$expected_pkg"

          jq -r --arg pr "$PR_NUMBER" '.pull_requests[$pr].files | to_entries[] | select(.key != "package.json") | [.key,.value] | @tsv' "$root/source-lock.json" |
          while IFS=$'\t' read -r path expected; do
            actual="$(git hash-object "$root/$path")"
            test "$actual" = "$expected" || {
              echo "source mismatch for PR $PR_NUMBER $path: expected=$expected actual=$actual" >&2
              exit 1
            }
          done

      - name: Run focused source contract parity
        shell: bash
        env:
          PR_NUMBER: ${{ matrix.pr }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/evidence/ores-stack-304-306"
          work="$RUNNER_TEMP/ores-stack-$PR_NUMBER"
          mkdir -p "$work/contracts" "$work/.ores-stack"
          cp "$root/pr-$PR_NUMBER/package.json" "$work/package.json"
          cp "$root/contracts/"* "$work/contracts/"

          cd "$work"
          npm install

          case "$PR_NUMBER" in
            304)
              npm run check:lambda-callable-registry
              ;;
            305)
              npm run check:lambda-callable-registry
              npm run check:lambda-build-manifest
              ;;
            306)
              npm run check:lambda-callable-registry
              npm run check:lambda-build-manifest
              npm run check:lambda-artifact-receipt
              ;;
            *)
              echo "unsupported PR number: $PR_NUMBER" >&2
              exit 1
              ;;
          esac
