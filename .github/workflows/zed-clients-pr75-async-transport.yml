name: zed-clients PR 75 async transport certification

on:
  pull_request:
    paths:
      - 'certification/zed-clients-pr75/**'
      - '.github/workflows/zed-clients-pr75-async-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out certification repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-clients
          ref: ce3101b933607283975ddc94080b5557aee84134
          path: product
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy

      - name: Verify immutable source identity and transport policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = 'ce3101b933607283975ddc94080b5557aee84134'
          grep -Fq '"pullRequest": 75' certification/zed-clients-pr75/source-pins.json
          matches="$(grep -RIn --exclude-dir=target 'reqwest::blocking' product/clients || true)"
          unexpected="$(printf '%s\n' "$matches" | grep -v '^product/clients/rust/src/lib.rs:' || true)"
          test -z "$unexpected"
          git diff --check

      - name: Execute exact product async crate
        shell: bash
        run: |
          set -euo pipefail
          manifest='product/clients/rust-async/Cargo.toml'
          cargo +1.98.1 fmt --manifest-path "$manifest" -- --check
          cargo +1.98.1 check --manifest-path "$manifest"
          cargo +1.98.1 test --manifest-path "$manifest" -- --nocapture
          cargo +1.98.1 clippy --manifest-path "$manifest" -- -D warnings

      - name: Execute black-box adversarial transport tests
        shell: bash
        run: |
          set -euo pipefail
          manifest='certification/zed-clients-pr75/Cargo.toml'
          cargo +1.98.1 fmt --manifest-path "$manifest" -- --check
          cargo +1.98.1 test --manifest-path "$manifest" --all-targets -- --nocapture
          cargo +1.98.1 clippy --manifest-path "$manifest" --all-targets -- -D warnings

      - name: Prove product checkout remained immutable
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = 'ce3101b933607283975ddc94080b5557aee84134'
          test -z "$(git -C product status --porcelain --untracked-files=no)"
