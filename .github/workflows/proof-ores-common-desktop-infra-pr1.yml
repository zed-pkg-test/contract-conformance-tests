name: certify ores common desktop infra pr1

on:
  push:
    branches:
      - proof/ores-common-desktop-infra-pr1
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: ORESoftware/ores-common-desktop-infra
  SOURCE_SHA: 7650bf7bb0c25d7f3c3a337a4970d639e8657429

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.TEST_FLEET_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Materialize exact source PR head
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone "https://github.com/${SOURCE_REPOSITORY}.git" /tmp/ores-common-desktop-infra
          git -C /tmp/ores-common-desktop-infra checkout --detach "${SOURCE_SHA}"
          test "$(git -C /tmp/ores-common-desktop-infra rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Test Rust workspace with generated lock proof
        working-directory: /tmp/ores-common-desktop-infra
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo generate-lockfile
          cargo test --workspace --all-targets --locked
          cp Cargo.lock "${GITHUB_WORKSPACE}/ores-common-desktop-infra.Cargo.lock"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          rebar3-version: "3.24.0"

      - name: Compile Erlang shared components
        shell: bash
        run: |
          set -euo pipefail
          for component in infra cli daemon; do
            (cd "/tmp/ores-common-desktop-infra/${component}/erlang" && rebar3 compile)
          done

      - uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform modules
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/ores-common-desktop-infra
          terraform fmt -check -recursive infra/terraform cli/terraform daemon/terraform
          for component in infra cli daemon; do
            terraform -chdir="${component}/terraform" init -backend=false
            terraform -chdir="${component}/terraform" validate
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ores-common-desktop-infra-cargo-lock
          path: ores-common-desktop-infra.Cargo.lock
          if-no-files-found: error

  flutter-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.TEST_FLEET_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Materialize exact source PR head
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone "https://github.com/${SOURCE_REPOSITORY}.git" /tmp/ores-common-desktop-infra
          git -C /tmp/ores-common-desktop-infra checkout --detach "${SOURCE_SHA}"
          test "$(git -C /tmp/ores-common-desktop-infra rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Install Flutter stable
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /tmp/flutter
          echo "/tmp/flutter/bin" >> "$GITHUB_PATH"
          /tmp/flutter/bin/flutter --version
          /tmp/flutter/bin/flutter precache --android

      - name: Analyze and test shared Flutter package
        working-directory: /tmp/ores-common-desktop-infra/flutter
        shell: bash
        run: |
          set -euo pipefail
          /tmp/flutter/bin/flutter pub get
          /tmp/flutter/bin/flutter analyze
          /tmp/flutter/bin/flutter test

      - name: Compile Android consumer app with native plugin
        shell: bash
        run: |
          set -euo pipefail
          /tmp/flutter/bin/flutter create --platforms=android --empty /tmp/ores-mobile-host-consumer
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/ores-mobile-host-consumer/pubspec.yaml')
          source = path.read_text()
          needle = 'dependencies:\n  flutter:\n'
          replacement = 'dependencies:\n  ores_common_mobile_host:\n    path: /tmp/ores-common-desktop-infra/flutter\n  flutter:\n'
          if needle not in source:
              raise SystemExit('could not locate dependencies section')
          path.write_text(source.replace(needle, replacement, 1))
          PY
          cat > /tmp/ores-mobile-host-consumer/lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:ores_common_mobile_host/ores_common_mobile_host.dart';

          void main() {
            const policy = KeepalivePromptPolicy(promptsPerDay: 4);
            policy.validate();
            runApp(const MaterialApp(home: SizedBox.shrink()));
          }
          DART
          cd /tmp/ores-mobile-host-consumer
          /tmp/flutter/bin/flutter pub get
          /tmp/flutter/bin/flutter build apk --debug

  flutter-ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.TEST_FLEET_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Materialize exact source PR head
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone "https://github.com/${SOURCE_REPOSITORY}.git" /tmp/ores-common-desktop-infra
          git -C /tmp/ores-common-desktop-infra checkout --detach "${SOURCE_SHA}"
          test "$(git -C /tmp/ores-common-desktop-infra rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Install Flutter stable
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /tmp/flutter
          echo "/tmp/flutter/bin" >> "$GITHUB_PATH"
          /tmp/flutter/bin/flutter --version
          /tmp/flutter/bin/flutter precache --ios

      - name: Compile iOS consumer app with native plugin
        shell: bash
        run: |
          set -euo pipefail
          /tmp/flutter/bin/flutter create --platforms=ios --empty /tmp/ores-mobile-host-consumer
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/ores-mobile-host-consumer/pubspec.yaml')
          source = path.read_text()
          needle = 'dependencies:\n  flutter:\n'
          replacement = 'dependencies:\n  ores_common_mobile_host:\n    path: /tmp/ores-common-desktop-infra/flutter\n  flutter:\n'
          if needle not in source:
              raise SystemExit('could not locate dependencies section')
          path.write_text(source.replace(needle, replacement, 1))
          PY
          cat > /tmp/ores-mobile-host-consumer/lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:ores_common_mobile_host/ores_common_mobile_host.dart';

          void main() {
            const policy = KeepalivePromptPolicy(promptsPerDay: 4);
            policy.validate();
            runApp(const MaterialApp(home: SizedBox.shrink()));
          }
          DART
          cd /tmp/ores-mobile-host-consumer
          /tmp/flutter/bin/flutter pub get
          /tmp/flutter/bin/flutter build ios --debug --no-codesign
