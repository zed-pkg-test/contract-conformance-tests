name: certify ores common desktop infra hardening

on:
  push:
    branches:
      - proof/ores-common-desktop-infra-hardening
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  core-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact mirrored source blobs
        shell: bash
        run: |
          set -euo pipefail
          root=fixtures/ores-common-desktop-infra
          grep -q 'b63e732707e4c7bbd205ed2a5dab71469158f35d' "$root/SOURCE.md"
          test "$(git hash-object "$root/cli/rust/src/lib.rs")" = f87cd19eaf2e3e88d043c9c616a97b3480989284
          test "$(git hash-object "$root/infra/rust/src/lib.rs")" = 285dcde1728569fccab54693d0484f91d94d58cb
          test "$(git hash-object "$root/desktop-app/rust/src/lib.rs")" = 583888657c3a42b171707ad70f00d439993e1d69
          test "$(git hash-object "$root/infra/erlang/src/ores_common_desktop_router.erl")" = a9c15be295446d4b71192babf22a05e9f2b86ed4
      - name: Test Rust workspace
        working-directory: fixtures/ores-common-desktop-infra
        run: |
          cargo clippy --workspace --all-targets -- -D warnings -A clippy::needless_return
          cargo test --workspace --all-targets
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "27.3"
          rebar3-version: "3.24.0"
      - name: Compile and test Erlang
        shell: bash
        run: |
          set -euo pipefail
          root="${GITHUB_WORKSPACE}/fixtures/ores-common-desktop-infra"
          for component in infra cli daemon; do
            (cd "${root}/${component}/erlang" && rebar3 compile && rebar3 eunit)
          done
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
      - name: Validate Terraform
        shell: bash
        run: |
          set -euo pipefail
          root="${GITHUB_WORKSPACE}/fixtures/ores-common-desktop-infra"
          cd "$root"
          terraform fmt -check -recursive infra/terraform cli/terraform daemon/terraform
          for component in infra cli daemon; do
            terraform -chdir="${component}/terraform" init -backend=false
            terraform -chdir="${component}/terraform" validate
          done

  flutter-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact Android blobs
        run: |
          root=fixtures/ores-common-desktop-infra/flutter/android/src/main/kotlin/com/oresoftware/common_desktop_infra
          test "$(git hash-object "$root/MobileHostForegroundService.kt")" = fd6471535fcf15c6b72be82d60815e6aa6afaa61
          test "$(git hash-object "$root/OresCommonMobileHostPlugin.kt")" = c5f45ab4d47416860a51ff240665418d98a4b4f4
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Analyze and test Flutter package
        working-directory: fixtures/ores-common-desktop-infra/flutter
        run: flutter pub get && flutter analyze && flutter test
      - name: Build Android consumer
        shell: bash
        run: |
          set -euo pipefail
          app=/tmp/ores_mobile_host_consumer
          rm -rf "$app"
          flutter create --platforms=android --empty "$app"
          cat > "$app/pubspec.yaml" <<EOF
          name: ores_mobile_host_consumer
          publish_to: none
          environment:
            sdk: ">=3.4.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            ores_common_mobile_host:
              path: ${GITHUB_WORKSPACE}/fixtures/ores-common-desktop-infra/flutter
          EOF
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' "$app/android/app/build.gradle.kts"
          cd "$app"
          flutter pub get
          flutter build apk --debug

  flutter-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact iOS blob
        run: |
          file=fixtures/ores-common-desktop-infra/flutter/ios/Classes/OresCommonMobileHostPlugin.swift
          test "$(git hash-object "$file")" = ab499695234c3e5ecd07b103ee9251e76f3f86cd
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build iOS consumer with host hooks
        shell: bash
        run: |
          set -euo pipefail
          app=/tmp/ores_mobile_host_consumer
          rm -rf "$app"
          flutter create --platforms=ios --empty "$app"
          cat > "$app/pubspec.yaml" <<EOF
          name: ores_mobile_host_consumer
          publish_to: none
          environment:
            sdk: ">=3.4.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            ores_common_mobile_host:
              path: ${GITHUB_WORKSPACE}/fixtures/ores-common-desktop-infra/flutter
          EOF
          cat > "$app/ios/Runner/AppDelegate.swift" <<'SWIFT'
          import Flutter
          import UIKit
          import ores_common_mobile_host

          @main
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
              GeneratedPluginRegistrant.register(with: self)
              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }
            override func application(_ application: UIApplication, didReceiveRemoteNotification userInfo: [AnyHashable: Any], fetchCompletionHandler completionHandler: @escaping (UIBackgroundFetchResult) -> Void) {
              OresCommonMobileHostPlugin.handleBackgroundPush(completion: completionHandler)
            }
          }
          SWIFT
          plist="$app/ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :BGTaskSchedulerPermittedIdentifiers array' "$plist"
          /usr/libexec/PlistBuddy -c 'Add :BGTaskSchedulerPermittedIdentifiers:0 string com.oresoftware.common-mobile-host.refresh' "$plist"
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes array' "$plist"
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes:0 string fetch' "$plist"
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes:1 string remote-notification' "$plist"
          cd "$app"
          flutter pub get
          flutter build ios --debug --no-codesign
