name: ores-cli Zed manifest mirrored exact-source certification

on:
  pull_request:
    paths:
      - 'certification/ores-cli-zpkg-kind-pr281/**'
      - '.github/workflows/ores-cli-zpkg-kind-mirrored-source.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-cli-zpkg-kind-mirrored-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact certification head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact mirrored product source
        shell: bash
        run: |
          set -euo pipefail
          root='certification/ores-cli-zpkg-kind-pr281'
          test "$(git hash-object "$root/src/audit/zpkg_manifest.rs")" = '9602c10c06b23d767ea11fea339bf129b462adcc'
          grep -Fq '"pullRequest": 281' "$root/source-pins.json"
          grep -Fq '"sha": "07aa63c95931bb32afd82e9c7c92550bc5e00286"' "$root/source-pins.json"
          grep -Fq '"zpkgManifestBlob": "9602c10c06b23d767ea11fea339bf129b462adcc"' "$root/source-pins.json"
          grep -Fq 'mod zpkg_manifest;' "$root/src/audit/mod.rs"
          git diff --check

      - name: Keep lint narrow and non-authoritative
        shell: bash
        run: |
          set -euo pipefail
          src='certification/ores-cli-zpkg-kind-pr281/src/audit/zpkg_manifest.rs'
          grep -Fq 'zpkg-package-kind-noncanonical' "$src"
          grep -Fq '`zed validate` remains the canonical executable validator' "$src"
          grep -Fq '.get("package")' "$src"
          grep -Fq 'package.contains_key("kind")' "$src"
          test "$(grep -c 'contains_key' "$src")" -eq 1
          ! grep -Eq 'allowed_fields|allowedFields|enum[[:space:]]+Package|struct[[:space:]]+Package' "$src"

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy

      - name: Format exact product module
        run: rustfmt +1.95.0 --edition 2021 --check certification/ores-cli-zpkg-kind-pr281/src/audit/zpkg_manifest.rs

      - name: Compile and execute debug regressions
        run: |
          set -euo pipefail
          cargo +1.95.0 check --manifest-path certification/ores-cli-zpkg-kind-pr281/Cargo.toml --all-targets
          cargo +1.95.0 test --manifest-path certification/ores-cli-zpkg-kind-pr281/Cargo.toml --all-targets -- --nocapture

      - name: Execute optimized regressions
        run: cargo +1.95.0 test --manifest-path certification/ores-cli-zpkg-kind-pr281/Cargo.toml --release --all-targets -- --nocapture

      - name: Deny warnings
        run: cargo +1.95.0 clippy --manifest-path certification/ores-cli-zpkg-kind-pr281/Cargo.toml --all-targets -- -D warnings

      - name: Prove mirrored product source remained immutable
        run: |
          set -euo pipefail
          test "$(git hash-object certification/ores-cli-zpkg-kind-pr281/src/audit/zpkg_manifest.rs)" = '9602c10c06b23d767ea11fea339bf129b462adcc'
          git diff --check
