name: api-docs 312 TypeScript codec parity proof

on:
  push:
    branches:
      - proof/api-docs-312-ts-cbor-20260929
  pull_request:

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out proof carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out exact api-docs source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/api-docs
          ref: 11db582f0e67880876d32e9a80c1a4c7672d9090
          path: source
          persist-credentials: false

      - name: Verify exact source commit and blob identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "11db582f0e67880876d32e9a80c1a4c7672d9090"
          test "$(git -C source hash-object clients/typescript/src/fluent-types.d.ts)" = "d7720dc2f675d8e06268e4af113500d3575c6502"
          test "$(git -C source hash-object clients/typescript/src/fluent-v2.type-test.ts)" = "c07478ec07e9ed6a2f94f1513f0de941a6591bbd"
          test "$(git -C source hash-object clients/typescript/src/options.generated.d.ts)" = "927e81fe75f0216e204759e1a2e0626d054b2ca6"
          grep -Fx 'source_head=11db582f0e67880876d32e9a80c1a4c7672d9090' proofs/api-docs-312/receipt.txt

      - name: Install Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - name: Install exact client dependencies
        run: npm ci --prefix source/clients/typescript --ignore-scripts --no-audit --no-fund

      - name: Compile exact TypeScript type-state proof
        run: npx --yes --package typescript@5.8.3 tsc --noEmit -p source/clients/typescript/src/tsconfig.fluent.json

      - name: Removing CBOR from public plan must fail type parity
        shell: bash
        run: |
          set -euo pipefail
          file=source/clients/typescript/src/fluent-types.d.ts
          cp "$file" /tmp/fluent-types.clean.d.ts
          python3 - <<'PY'
          from pathlib import Path
          path = Path('source/clients/typescript/src/fluent-types.d.ts')
          text = path.read_text()
          old = '"json" | "message_pack" | "cbor" | "protobuf"'
          new = '"json" | "message_pack" | "protobuf"'
          if old not in text:
              raise SystemExit('expected canonical strategy union not found')
          path.write_text(text.replace(old, new, 1))
          PY
          if npx --yes --package typescript@5.8.3 tsc --noEmit -p source/clients/typescript/src/tsconfig.fluent.json; then
            echo 'type proof admitted removal of catalog-supported CBOR' >&2
            exit 1
          fi
          cp /tmp/fluent-types.clean.d.ts "$file"

      - name: Adding undeclared public strategy must fail type parity
        shell: bash
        run: |
          set -euo pipefail
          file=source/clients/typescript/src/fluent-types.d.ts
          cp "$file" /tmp/fluent-types.clean-extra.d.ts
          python3 - <<'PY'
          from pathlib import Path
          path = Path('source/clients/typescript/src/fluent-types.d.ts')
          text = path.read_text()
          old = '"json" | "message_pack" | "cbor" | "protobuf"'
          new = '"json" | "message_pack" | "cbor" | "protobuf" | "yaml"'
          if old not in text:
              raise SystemExit('expected canonical strategy union not found')
          path.write_text(text.replace(old, new, 1))
          PY
          if npx --yes --package typescript@5.8.3 tsc --noEmit -p source/clients/typescript/src/tsconfig.fluent.json; then
            echo 'type proof admitted public strategy absent from generated catalog' >&2
            exit 1
          fi
          cp /tmp/fluent-types.clean-extra.d.ts "$file"

      - name: Prove source restored exactly
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source hash-object clients/typescript/src/fluent-types.d.ts)" = "d7720dc2f675d8e06268e4af113500d3575c6502"
          git -C source diff --exit-code -- clients/typescript/src/fluent-types.d.ts clients/typescript/src/fluent-v2.type-test.ts clients/typescript/src/options.generated.d.ts
