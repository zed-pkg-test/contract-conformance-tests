name: External shared-source package admission
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-interfaces
          ref: ac18d10846dd3b9a918c42a81c12b2dc6df79599
          path: tmp/shared-hub
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ores-otel/ores-interfaces
          ref: bcaccb2c0d9b203d268c7bde37552ea9be24547f
          path: tmp/shared-hub/.deps/compat
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: 4473504c4c9d2831d825919f70c03994d8ce01d2
          path: tmp/shared-hub/.deps/tjsv
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install the actual pinned TJSV compiler toolchain
        run: npm ci --prefix tmp/shared-hub/.deps/tjsv
      - name: Replay checkout and compiler-backed package regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/shared-package-evidence
          npm run check --prefix tmp/shared-hub 2>&1 | tee tmp/shared-package-evidence/checks.log
      - name: Consume and re-admit the actual packed source bytes
        run: node shared-package/verify.mjs
      - name: Preserve unchanged test repository
        run: git diff --exit-code HEAD
      - name: Retain package and positive or failed test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shared-source-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            tmp/shared-package-evidence/checks.log
            tmp/shared-package-evidence/receipt.json
            tmp/shared-package-evidence/*.tgz
          if-no-files-found: error
          retention-days: 14
