name: certify ores-sw 20 shared socket

on:
  pull_request:
    paths:
      - "evidence/ores-sw-20/**"
      - "tools/verify_ores_sw_20_browser.mjs"
      - ".github/workflows/certify-ores-sw-20-shared-socket.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ORES_SW_SHA: 4663e45b0ec4dc4d24792235f4c550355a603602

jobs:
  source-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out proof carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify byte-identical private-source snapshot
        shell: bash
        run: |
          set -euo pipefail
          lock='evidence/ores-sw-20/source-lock.json'
          root="$(jq -r '.snapshot_root' "$lock")"
          test "$(jq -r '.commit_sha' "$lock")" = "$ORES_SW_SHA"
          while IFS=$'\t' read -r file expected; do
            actual="$(git hash-object "$root/$file")"
            test "$actual" = "$expected" || {
              echo "blob mismatch: $file expected=$expected actual=$actual" >&2
              exit 1
            }
          done < <(jq -r '.files | to_entries[] | [.key,.value] | @tsv' "$lock")

  typescript-browser-surface:
    needs: source-lock
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.9.0'
      - name: Install isolated compiler dependencies
        shell: bash
        run: |
          set -euo pipefail
          harness="$RUNNER_TEMP/ores-sw-compiler"
          mkdir -p "$harness"
          printf '{"private":true,"type":"module"}\n' > "$harness/package.json"
          npm install --prefix "$harness" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund typescript@5.9.2 esbuild@0.25.9
      - name: Typecheck browser client and SharedWorker surfaces
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/evidence/ores-sw-20/source"
          tsc="$RUNNER_TEMP/ores-sw-compiler/node_modules/.bin/tsc"
          "$tsc" --noEmit --strict --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,DOM \
            "$root/src/protocol.ts" "$root/src/socket-protocol.ts" "$root/src/shared-socket.ts"
          "$tsc" --noEmit --strict --target ES2022 --module ESNext --moduleResolution Bundler --lib ES2022,WebWorker \
            "$root/src/protocol.ts" "$root/src/socket-protocol.ts" "$root/src/workers/socket.shared-worker.ts"
      - name: Bundle exact snapshot as browser modules
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/evidence/ores-sw-20/source"
          esbuild="$RUNNER_TEMP/ores-sw-compiler/node_modules/.bin/esbuild"
          mkdir -p "$RUNNER_TEMP/ores-sw-build/dist"
          "$esbuild" "$root/src/shared-socket.ts" --bundle --format=esm --platform=browser --target=es2022 --outfile="$RUNNER_TEMP/ores-sw-build/dist/client.js"
          "$esbuild" "$root/src/workers/socket.shared-worker.ts" --bundle --format=esm --platform=browser --target=es2022 --outfile="$RUNNER_TEMP/ores-sw-build/dist/socket.shared-worker.js"
          test -s "$RUNNER_TEMP/ores-sw-build/dist/client.js"
          test -s "$RUNNER_TEMP/ores-sw-build/dist/socket.shared-worker.js"

  browser-multitab:
    needs: [source-lock, typescript-browser-surface]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out proof carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.9.0'
      - name: Install isolated browser proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          harness="$RUNNER_TEMP/ores-sw-browser-harness"
          mkdir -p "$harness"
          printf '{"private":true,"type":"module"}\n' > "$harness/package.json"
          npm install --prefix "$harness" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.0 ws@8.18.3 esbuild@0.25.9
          "$harness/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build byte-identical browser snapshot
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/evidence/ores-sw-20/source"
          esbuild="$RUNNER_TEMP/ores-sw-browser-harness/node_modules/.bin/esbuild"
          mkdir -p "$RUNNER_TEMP/ores-sw-build/dist"
          "$esbuild" "$root/src/shared-socket.ts" --bundle --format=esm --platform=browser --target=es2022 --outfile="$RUNNER_TEMP/ores-sw-build/dist/client.js"
          "$esbuild" "$root/src/workers/socket.shared-worker.ts" --bundle --format=esm --platform=browser --target=es2022 --outfile="$RUNNER_TEMP/ores-sw-build/dist/socket.shared-worker.js"
      - name: Prove 10-tab pooling, partitioning, reconnect, isolation, and send-only sharing
        env:
          ORES_SW_SOURCE: ${{ runner.temp }}/ores-sw-build
          ORES_SW_HARNESS_DIR: ${{ runner.temp }}/ores-sw-browser-harness
        run: node tools/verify_ores_sw_20_browser.mjs
